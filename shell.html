<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wittgenstein 3D</title>
<style>
  :root { --ink: #d8d2c4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05050a; overflow: hidden; }
  body { font-family: "Courier New", ui-monospace, monospace; color: var(--ink); }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* grain + vignette: everything is being remembered, not seen */
  #grain, #vig { position: fixed; inset: 0; pointer-events: none; }
  #grain {
    opacity: .16; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.6'/></svg>");
    animation: shift .28s steps(1) infinite;
  }
  @keyframes shift {
    0%   { background-position: 0 0; }
    25%  { background-position: -40px 30px; }
    50%  { background-position: 60px -20px; }
    75%  { background-position: -25px -55px; }
    100% { background-position: 35px 45px; }
  }
  #vig { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 38%, rgba(0,0,0,.62) 100%); }

  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .8s; }
  #cross {
    position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
    border-radius: 50%; background: rgba(230,225,210,.35); transition: all .18s;
  }
  #cross.on { width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; background: rgba(255,240,210,.85); }
  #help {
    position: absolute; left: 50%; top: calc(50% + 22px); transform: translateX(-50%);
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase; opacity: .6;
  }
  #prompt {
    position: absolute; left: 0; right: 0; bottom: 12%; text-align: center;
    font-size: 15px; letter-spacing: .32em; opacity: 0; transition: opacity 1.1s;
    text-transform: lowercase; color: #cfc6b0; text-shadow: 0 0 24px #000;
  }

  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: radial-gradient(ellipse at center, #16140f 0%, #050506 70%);
    transition: opacity 1.3s; z-index: 10;
  }
  h1 { font-size: clamp(28px, 6vw, 62px); letter-spacing: .12em; margin: 0; font-weight: 400; }
  h1 span { opacity: .45; }
  .sub { opacity: .5; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; }
  .keys { opacity: .42; font-size: 12.5px; line-height: 2; text-align: center; letter-spacing: .06em; }
  button {
    font-family: inherit; font-size: 13px; letter-spacing: .3em; text-transform: uppercase;
    color: var(--ink); background: transparent; border: 1px solid rgba(216,210,196,.35);
    padding: 13px 34px; cursor: pointer; transition: .3s;
  }
  button:hover { background: rgba(216,210,196,.1); border-color: rgba(216,210,196,.7); }
  #paused { display: none; background: rgba(4,4,6,.82); cursor: pointer; }
  .seed { opacity: .3; font-size: 11px; letter-spacing: .2em; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="grain"></div>
<div id="vig"></div>

<div id="hud">
  <div id="cross"></div>
  <div id="help"></div>
  <div id="prompt"></div>
</div>

<div class="screen" id="title">
  <h1>WITTGENSTEIN <span>3D</span></h1>
  <div class="sub">a house with more rooms than it has</div>
  <div class="seed" id="seed"></div>
  <div class="keys">
    WASD walk &nbsp;·&nbsp; mouse look &nbsp;·&nbsp; shift hurry<br>
    click take &nbsp;·&nbsp; right-click throw &nbsp;·&nbsp; E open &nbsp;·&nbsp; wheel push / pull
  </div>
  <div class="row"><button id="start">enter</button><button id="another">another house</button></div>
</div>

<div class="screen" id="paused"><div class="sub">click to return</div></div>

<script>
/* __THREE__ */
/* __CANNON__ */
/* __GAME__ */
</script>
</body>
</html>
